[workspace]
members = [".", "smolgent-macros", "smolgent-python"]
default-members = [".", "smolgent-macros"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["pts1667"]
repository = "https://github.com/pts1667/smolgent"

[package]
name = "smolgent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A small, extensible LLM tool-calling agent harness"
readme = "README.md"
keywords = ["llm", "agent", "tool-calling", "openrouter"]
categories = ["api-bindings", "development-tools"]

[dependencies]
async-stream = "0.3"
futures-channel = { version = "0.3", features = ["sink"] }
futures-util = { version = "0.3", features = ["sink"] }
base64 = "0.22"
keyring-core = "1.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smolgent-macros = { version = "0.1.0", path = "smolgent-macros" }
thiserror = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[dev-dependencies]
crossterm = "0.29.0"
dotenvy = "0.15.7"
httpmock = "0.7"
ratatui = "0.30.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
